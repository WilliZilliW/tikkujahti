# Play release from a tag: pushing v1.2.3 builds a signed AAB with versionName 1.2.3 and attaches it to a
# GitHub release, ready to upload to Google Play.
#
# Secrets: TIKKU_UPLOAD_KEYSTORE_BASE64 (the upload keystore, base64), TIKKU_KEYSTORE_PASSWORD,
# TIKKU_KEY_ALIAS, TIKKU_KEY_PASSWORD.
name: Julkaisu

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  aab:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Testit
        run: ./gradlew :shared:jvmTest
      - name: Allekirjoitusavain
        env:
          KEYSTORE: ${{ secrets.TIKKU_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE" ]; then echo "::error::Salaisuus TIKKU_UPLOAD_KEYSTORE_BASE64 puuttuu"; exit 1; fi
          echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/upload.jks"
      - name: Rakenna AAB
        env:
          TIKKU_KEYSTORE_FILE: ${{ runner.temp }}/upload.jks
          TIKKU_KEYSTORE_PASSWORD: ${{ secrets.TIKKU_KEYSTORE_PASSWORD }}
          TIKKU_KEY_ALIAS: ${{ secrets.TIKKU_KEY_ALIAS }}
          TIKKU_KEY_PASSWORD: ${{ secrets.TIKKU_KEY_PASSWORD }}
        run: ./gradlew :androidApp:bundleRelease -PtikkuVersion="${GITHUB_REF_NAME#v}"
      - name: Nimeä AAB
        run: cp androidApp/build/outputs/bundle/release/androidApp-release.aab "tikkujahti-${GITHUB_REF_NAME#v}.aab"
      - name: Julkaise
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" tikkujahti-*.aab --title "Tikkujahti ${GITHUB_REF_NAME#v}" --generate-notes
